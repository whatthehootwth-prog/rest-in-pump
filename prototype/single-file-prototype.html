<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Fluffy Owl Walk</title>
<style>
  :root { --ink:#ece8ff; --glass:rgba(16,12,32,.58); --line:rgba(255,255,255,.10); }
  html,body { margin:0; height:100%; overflow:hidden; background:#120e22; color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display:block; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .panel { position:fixed; background:var(--glass); border:1px solid var(--line); border-radius:12px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); user-select:none; }
  #title { top:16px; left:16px; padding:10px 14px; font-size:14px; letter-spacing:.02em; }
  #title b { font-weight:650; }
  #title span { opacity:.65; font-size:12px; display:block; margin-top:2px; }
  #help { left:16px; bottom:16px; padding:10px 14px; font-size:12.5px; line-height:1.9; }
  kbd { display:inline-block; min-width:18px; text-align:center; padding:0 5px; margin:0 1px; border-radius:5px;
    border:1px solid rgba(255,255,255,.22); border-bottom-width:2px; background:rgba(255,255,255,.07);
    font: 600 11px/18px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #loader { position:fixed; inset:0; display:grid; place-items:center; background:#120e22; z-index:10;
    transition:opacity .6s ease; font-size:14px; letter-spacing:.04em; }
  #loader.done { opacity:0; pointer-events:none; }
  #pad { display:none; right:16px; bottom:16px; padding:8px; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:6px; }
  #pad button { all:unset; display:grid; place-items:center; border-radius:10px; background:rgba(255,255,255,.08);
    border:1px solid var(--line); font-size:20px; touch-action:none; }
  #pad button:active { background:rgba(255,255,255,.2); }
  #jump { display:none; right:16px; bottom:142px; width:64px; height:64px; border-radius:50%; place-items:center; font-size:12px; font-weight:600; }
  @media (pointer:coarse) { #pad { display:grid; } #jump { display:grid; } #help { display:none; } }
  
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  drag mouse or <kbd>Q</kbd><kbd>E</kbd> orbit camera &nbsp; scroll zoom

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ utils */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const lerpAngle = (a, b, t) => { const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
let seed = 1337;
const rand = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rr = (a, b) => a + (b - a) * rand();
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h2(xi, yi), h2(xi + 1, yi), u), lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
}
const fbm2 = (x, y) => noise2(x, y) * 0.5 + noise2(x * 2.1 + 5, y * 2.1) * 0.3 + noise2(x * 4.3, y * 4.3 + 9) * 0.2;
const UP = new THREE.Vector3(0, 1, 0);

/* --------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0x3a2c55);
scene.fog = new THREE.FogExp2(FOG, 0.024);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.05, 600);
const clockU = { value: 0 };

/* --------------------------------------------------------------- textures */
function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  return t;
}
function speckle(g, s, base, spread, n) {
  const img = g.createImageData(s, s);
  for (let i = 0; i < s * s; i++) {
    const v = base + (Math.random() - 0.5) * spread;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < n; k++) {               // little fibres
    const x = Math.random() * s, y = Math.random() * s, a = Math.random() * Math.PI, l = 2 + Math.random() * 6;
    g.strokeStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${0.08 + Math.random() * 0.12})`;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
}
const feltBumpEye = canvasTex(256, (g, s) => speckle(g, s, 128, 70, 2500), 3);
const feltBumpBeak = canvasTex(256, (g, s) => speckle(g, s, 128, 70, 2500), 22);
const stoneTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#8d8a92'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2600; i++) {
    const v = 110 + Math.random() * 70 | 0;
    g.fillStyle = `rgba(${v},${v},${v + 6},${0.15 + Math.random() * 0.25})`;
    const r = Math.random() * 6; g.beginPath(); g.arc(Math.random() * s, Math.random() * s, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 70; i++) {                // moss
    g.fillStyle = `rgba(${70 + Math.random() * 30 | 0},${100 + Math.random() * 40 | 0},${60},${0.12 + Math.random() * 0.2})`;
    g.beginPath(); g.arc(Math.random() * s, Math.random() * s, 4 + Math.random() * 22, 0, 7); g.fill();
  }
  for (let i = 0; i < 25; i++) {                // cracks
    g.strokeStyle = 'rgba(40,38,48,.35)'; g.lineWidth = 1;
    let x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (Math.random() - .5) * 18; y += Math.random() * 12; g.lineTo(x, y); }
    g.stroke();
  }
}, 1);
stoneTex.colorSpace = THREE.SRGBColorSpace;
const groundDetail = canvasTex(256, (g, s) => {
  const img = g.createImageData(s, s);
  for (let i = 0; i < s * s; i++) { const v = 200 + Math.random() * 55; img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v; img.data[i*4+3]=255; }
  g.putImageData(img, 0, 0);
}, 90);
function textTex(lines, w = 256, h = 128) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = lines.length > 1 ? h * 0.3 : h * 0.46;
  g.font = `600 ${fs}px Georgia, "Times New Roman", serif`;
  lines.forEach((ln, i) => {
    const y = h / 2 + (i - (lines.length - 1) / 2) * fs * 1.15;
    g.fillStyle = 'rgba(230,228,240,.35)'; g.fillText(ln, w / 2 + 1.5, y + 1.5);
    g.fillStyle = 'rgba(38,34,48,.9)'; g.fillText(ln, w / 2, y);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

/* ============================================================ TOON LOOK */
// 4-step cel-shading ramp + a cool rim light, and black "inverted hull" outlines.
const toonRamp = (() => {
  const t = new THREE.DataTexture(new Uint8Array([105, 170, 228, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
function toonMat(color, rim = 0x9fb0ff, rimAmt = 0.4) {
  const m = new THREE.MeshToonMaterial({ color, gradientMap: toonRamp });
  const rc = new THREE.Color(rim);
  m.onBeforeCompile = (s) => {
    s.fragmentShader = s.fragmentShader.replace(/#include <(opaque|output)_fragment>/, (all) => `
{
  float rimF = 1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);
  outgoingLight += vec3(${rc.r.toFixed(3)}, ${rc.g.toFixed(3)}, ${rc.b.toFixed(3)}) * smoothstep(0.55, 0.75, rimF) * ${rimAmt.toFixed(2)};
}
${all}`);
  };
  m.customProgramCacheKey = () => `toon-rim-${rim}-${rimAmt}`;
  return m;
}
function outlineMat(th) {
  const m = new THREE.MeshBasicMaterial({ color: 0x07060c, side: THREE.BackSide });
  const u = { uTh: { value: th } };
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, u);
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTh;')
      .replace('#include <begin_vertex>', 'vec3 transformed = position + normal * uTh;');
  };
  m.customProgramCacheKey = () => 'outline-hull';
  return m;
}
/** A cel-shaded mesh with a black outline around it. */
function toonPart(geo, mat, th = 0.011) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(geo, mat); body.castShadow = body.receiveShadow = true;
  g.add(new THREE.Mesh(geo, outlineMat(th)), body);
  return g;
}

/* ---------------------------------------------------- cartoon fur tufts */
function weldNormals(geo) {
  const p = geo.attributes.position, n = geo.attributes.normal, map = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = `${Math.round(p.getX(i) * 1e4)},${Math.round(p.getY(i) * 1e4)},${Math.round(p.getZ(i) * 1e4)}`;
    let e = map.get(k); if (!e) map.set(k, e = { n: new THREE.Vector3(), ids: [] });
    e.n.x += n.getX(i); e.n.y += n.getY(i); e.n.z += n.getZ(i); e.ids.push(i);
  }
  for (const e of map.values()) { e.n.normalize(); for (const i of e.ids) n.setXYZ(i, e.n.x, e.n.y, e.n.z); }
}
const h3 = (x, y, z, k) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + k * 19.19) * 43758.5453; return s - Math.floor(s); };
function worley(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z); let best = 9;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
    const cx = xi + a, cy = yi + b, cz = zi + c;
    const dx = x - (cx + h3(cx, cy, cz, 1)), dy = y - (cy + h3(cx, cy, cz, 2)), dz = z - (cz + h3(cx, cy, cz, 3));
    best = Math.min(best, dx * dx + dy * dy + dz * dz);
  }
  return Math.sqrt(best);
}
/**
 * Shape a geometry: fn(v) moves each vertex and returns how "tufty" that spot is (0 = smooth).
 * Then cone-shaped fur tufts are pushed out (drooping downward) like a cartoon's jagged fur outline.
 */
function toonShape(geo, fn, { cell = 0.05, amp = 0.024, droop = 0.45 } = {}) {
  const p = geo.attributes.position, v = new THREE.Vector3(), amps = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const a = fn(v); amps[i] = a ?? 1; p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); weldNormals(geo);
  if (amp > 0) {
    const n = geo.attributes.normal, d = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      if (amps[i] <= 0) continue;
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const f = worley(x / cell, y / cell, z / cell);
      const s = Math.pow(clamp(1 - f * 1.5, 0, 1), 1.25) * amp * amps[i];
      d.set(n.getX(i), n.getY(i) - droop * 0.6, n.getZ(i)).normalize();
      p.setXYZ(i, x + d.x * s, y + d.y * s, z + d.z * s);
    }
    // keep the smooth pre-tuft normals: flat cartoon shading inside, jagged fur only on the silhouette
  }
  return geo;
}

/* ============================================================ OWL GEOMETRY */
// The head is the mascot drawing: a round fuzzy ball with a giant screaming open beak, mismatched googly eyes
// (measured off the drawing) and two small ear tufts. It sits on a tiny, slim little body.
const BODY = { a: 0.62, b: 0.52, c: 0.5, y: 0.52 };          // half extents + centre height inside the body group
const EYES = [
  { x: -0.275, y: 0.13, r: 0.2, pupil: [-0.05, -0.005], pr: 0.036 },   // big one (viewer's left)
  { x: 0.25, y: 0.205, r: 0.135, pupil: [0.045, 0.018], pr: 0.027 },   // small one, higher up
];
const RING = 0.034;                                           // eye outline thickness
// the mouth outline: apex at the top, wide jaw at the bottom with the little ^ notch
const MOUTH_TOP = { x: 0.02, y: 0.215 };
const MOUTH = [[0, 0], [-0.147, -0.392], [0, -0.317], [0.12, -0.377], [0.06, -0.125]];
const MANDIBLE = [[0, 0.004], [-0.094, -0.188], [-0.03, -0.163], [0.022, -0.142], [0.062, -0.126]];
const THROAT = [[-0.09, -0.185], [-0.118, -0.262], [-0.03, -0.22], [0.05, -0.205], [0.07, -0.16], [0.062, -0.126]];
function mouthDist(x, y) {     // rough signed distance (+ outside) from the mouth area on the face
  const t = clamp((MOUTH_TOP.y - y) / 0.39, 0, 1), halfW = 0.135 * t;
  return Math.max(Math.abs(x - MOUTH_TOP.x + 0.01) - halfW, y - MOUTH_TOP.y, MOUTH_TOP.y - 0.4 - y);
}
function bodyGeometry(seg, tufts) {
  return toonShape(new THREE.SphereGeometry(1, seg, Math.round(seg * 0.75)), (v) => {
    const d = v.clone();
    const n = 2.25, k = Math.pow(Math.abs(d.x) ** n + Math.abs(d.y) ** n + Math.abs(d.z) ** n, 1 / n);
    v.set(lerp(d.x, d.x / k, 0.5), lerp(d.y, d.y / k, 0.5), lerp(d.z, d.z / k, 0.5));
    v.x *= 1 + 0.07 * clamp(-d.y, 0, 1);                       // a bit pear-shaped, like the drawing
    if (d.y < -0.55) v.y = -0.55 + (v.y + 0.55) * 0.75;           // sits flat-ish on its feet
    if (d.z > 0) v.z *= 0.93;
    let tuft = 1;
    for (const [sx, big, px, py] of [[-1, 0.9, -0.62, 0.7], [1, 1.1, 0.58, 0.74]]) {   // two small ear tufts
      const dist = Math.hypot(d.x - px, d.y - py, d.z * 0.9);
      const c = Math.pow(clamp(1 - dist / 0.32, 0, 1), 2.0) * big;
      v.y += 0.38 * c; v.x += sx * 0.1 * c;
      tuft += 1.4 * c;
    }
    v.x *= BODY.a; v.y *= BODY.b; v.z *= BODY.c;
    let a = tuft * (1 - smooth(0.35, 0.75, d.z));                // jagged fur round the edges, clean face
    if (d.z > 0) {
      for (const e of EYES) a *= smooth(e.r, e.r + 0.06, Math.hypot(v.x - e.x, v.y - e.y));
      a *= smooth(0.0, 0.07, mouthDist(v.x, v.y));
    }
    return a;
  }, tufts ? { cell: 0.075, amp: 0.065, droop: 0.55 } : { amp: 0 });
}
/** Capsule with evenly spaced rows all the way up (three's capsule has one long row in the middle). */
function capsule(r, len, radial, rows) {
  const total = Math.PI * r + len, q = Math.PI * r / 2, pts = [];
  for (let i = 0; i <= rows; i++) {
    const s = i / rows * total; let x, y;
    if (s < q) { const a = s / r; x = r * Math.sin(a); y = -len / 2 - r * Math.cos(a); }
    else if (s < q + len) { x = r; y = -len / 2 + (s - q); }
    else { const a = (s - q - len) / r + Math.PI / 2; x = r * Math.sin(a); y = len / 2 - r * Math.cos(a); }
    pts.push(new THREE.Vector2(Math.max(x, 0), y));
  }
  return new THREE.LatheGeometry(pts, radial);
}
// slim little body parts (rig units; the whole rig is scaled to 70%, so the owl stands ~0.9 tall)
function torsoGeometry() {
  return toonShape(capsule(0.165, 0.2, 90, 72), (v) => {
    const hip = smooth(0.0, -0.3, v.y);
    v.x *= 1.0 * (1 + 0.08 * hip);
    v.z *= 0.88 * (v.z > 0 ? 1 + 0.1 * smooth(0.3, 0.0, Math.abs(v.y + 0.05)) : 1);   // round belly
    return 1;
  }, { cell: 0.06, amp: 0.045 });
}
function armGeometry() {
  const g = capsule(0.048, 0.2, 40, 48); g.translate(0, -0.1, 0);
  return toonShape(g, (v) => { const b = 1 + 0.12 * smooth(-0.08, 0.04, v.y); v.x *= b; v.z *= b; return 1; }, { cell: 0.05, amp: 0.032 });
}
function handGeometry() {
  return toonShape(new THREE.SphereGeometry(1, 36, 28), (v) => { v.set(v.x * 0.062, v.y * 0.072, v.z * 0.058); return 0.5; }, { cell: 0.04, amp: 0.016, droop: 0.4 });
}
function legGeometry() {
  const g = capsule(0.06, 0.27, 44, 64); g.translate(0, -0.155, 0);
  return toonShape(g, (v) => { const f = 1 + 0.15 * smooth(-0.22, -0.35, v.y); v.x *= f; v.z *= f; return 1 + 0.4 * smooth(-0.27, -0.35, v.y); },
    { cell: 0.05, amp: 0.034 });
}
/** Orange three-toed cartoon bird foot. */
function footGeometry() {
  const pad = new THREE.SphereGeometry(1, 28, 18); pad.scale(0.09, 0.05, 0.085);
  const parts = [pad];
  for (const a of [-0.55, 0, 0.55]) {
    const toe = new THREE.CapsuleGeometry(0.036, 0.09, 8, 16);
    toe.rotateX(Math.PI / 2); toe.scale(1, 0.85, 1); toe.translate(0, -0.012, 0.075);
    toe.rotateY(a); parts.push(toe);
  }
  const g = merge(parts.map(p => { p.deleteAttribute('uv'); return p; }));
  return toonShape(g, () => 0, { amp: 0 });
}

/* ------------------------------------------------------------- materials */
const matWhite = toonMat(0xffffff);
const matEye = toonMat(0xffffff, 0xffffff, 0.15);
const matInk = new THREE.MeshBasicMaterial({ color: 0x07060c });
const matBeak = toonMat(0xff9419, 0xffd27a, 0.35);
const matMouth = new THREE.MeshToonMaterial({ color: 0xff3010, gradientMap: toonRamp, side: THREE.DoubleSide });
const matThroat = new THREE.MeshToonMaterial({ color: 0xa00510, gradientMap: toonRamp, polygonOffset: true, polygonOffsetFactor: -2 });
const matFoot = toonMat(0xff8d1a, 0xffd27a, 0.35);

function roundedShape(pts, r) {
  const s = new THREE.Shape(), n = pts.length;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const ra = Math.min(r, da * 0.45), rb = Math.min(r, db * 0.45);
    const A = [p[0] + (a[0] - p[0]) / da * ra, p[1] + (a[1] - p[1]) / da * ra];
    const B = [p[0] + (b[0] - p[0]) / db * rb, p[1] + (b[1] - p[1]) / db * rb];
    if (i === 0) s.moveTo(A[0], A[1]); else s.lineTo(A[0], A[1]);
    s.quadraticCurveTo(p[0], p[1], B[0], B[1]);
  }
  s.closePath(); return s;
}
function offsetPoly(pts, d) {
  const n = pts.length;
  return pts.map((p, i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const e1 = [p[0] - a[0], p[1] - a[1]], e2 = [b[0] - p[0], b[1] - p[1]];
    const l1 = Math.hypot(...e1), l2 = Math.hypot(...e2);

const fireflies = (() => {
  const N = 140, pos = new Float32Array(N * 3), sd = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos[i * 3] = rr(-24, 24); pos[i * 3 + 1] = rr(0.3, 2.6); pos[i * 3 + 2] = rr(-22, 26); sd[i] = rand(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: clockU, uPR: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float aSeed; uniform float uTime; uniform float uPR; varying float vA;
      void main(){ vec3 p = position; float t = uTime * 0.45 + aSeed * 20.;
        p.x += sin(t * 0.9 + aSeed * 6.) * 0.9; p.y += sin(t * 1.3 + aSeed * 3.) * 0.35; p.z += cos(t * 0.7 + aSeed * 9.) * 0.9;
        vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
        vA = 0.25 + 0.75 * pow(0.5 + 0.5 * sin(uTime * 2.2 + aSeed * 40.), 3.);
        gl_PointSize = 55.0 * uPR / -mv.z; }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - .5); float a = smoothstep(.5, 0., d); a *= a;
        gl_FragColor = vec4(vec3(1., .88, .45) * a * vA * 1.6, a * vA); }`,
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; scene.add(pts); return pts;
})();

/* ================================================================= PLAYER */
const owl = buildOwl();
scene.add(owl.root, owl.blob);
const player = { pos: new THREE.Vector3(0, 0, 12), yaw: 0, speed: 0, dir: new THREE.Vector3(0, 0, 1), y: 0, vy: 0, grounded: true, phase: 0, land: 0 };
const PR = 0.3;

function resolve(p) {
  for (let pass = 0; pass < 2; pass++) {
    for (const c of circles) {
      const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = PR + c.r;
      if (d < m && d > 1e-6) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
    }
    for (const [x0, z0, x1, z1] of segs) {
      const ex = x1 - x0, ez = z1 - z0, t = clamp(((p.x - x0) * ex + (p.z - z0) * ez) / (ex * ex + ez * ez), 0, 1);
      const qx = x0 + ex * t, qz = z0 + ez * t, dx = p.x - qx, dz = p.z - qz, d = Math.hypot(dx, dz);
      if (d < PR && d > 1e-6) { p.x = qx + dx / d * PR; p.z = qz + dz / d * PR; }
    }
    const r = Math.hypot(p.x, p.z); if (r > 33) { p.x *= 33 / r; p.z *= 33 / r; }
  }
}

/* ================================================================== INPUT */
const keys = new Set();
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', (e) => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.code === 'KeyF' && !e.repeat) owl.nextWalk();
  keys.add(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
document.querySelectorAll('[data-code]').forEach((b) => {
  const c = b.dataset.code, on = (e) => { e.preventDefault(); keys.add(c); }, off = () => keys.delete(c);
  b.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
});
const cam = { yaw: 0, pitch: 0.22, dist: 3.2, tYaw: 0, tPitch: 0.22, tDist: 3.2, target: new THREE.Vector3(0, 0.58, 12) };
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!drag) return;
  cam.tYaw -= (e.clientX - drag.x) * 0.006; cam.tPitch = clamp(cam.tPitch + (e.clientY - drag.y) * 0.004, -0.05, 1.25);
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => (drag = null));
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.tDist = clamp(cam.tDist * (1 + e.deltaY * 0.0012), 1.4, 14); }, { passive: false });

/* =================================================================== LOOP */
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3(), mv = new THREE.Vector3();
function update(dt, t) {
  const k = (c) => keys.has(c);
  if (k('KeyQ')) cam.tYaw += 1.8 * dt;
  if (k('KeyE')) cam.tYaw -= 1.8 * dt;
  fwd.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)); rgt.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
  const iz = (k('ArrowUp') || k('KeyW') ? 1 : 0) - (k('ArrowDown') || k('KeyS') ? 1 : 0);
  const ix = (k('ArrowRight') || k('KeyD') ? 1 : 0) - (k('ArrowLeft') || k('KeyA') ? 1 : 0);
  mv.set(0, 0, 0).addScaledVector(fwd, iz).addScaledVector(rgt, ix);
  const moving = mv.lengthSq() > 0;
  const running = k('ShiftLeft') || k('ShiftRight');
  if (moving) {
    mv.normalize(); player.dir.copy(mv);
    player.yaw = lerpAngle(player.yaw, Math.atan2(mv.x, mv.z), 1 - Math.exp(-11 * dt));
  }
  player.speed = damp(player.speed, moving ? (running ? 3.6 : 1.8) : 0, moving ? 7 : 10, dt);
  player.pos.addScaledVector(player.dir, player.speed * dt);
  resolve(player.pos);
  // hop
  if (k('Space') && player.grounded) { player.vy = 4.8; player.grounded = false; }
  if (!player.grounded) {
    player.vy -= 12.5 * dt; player.y += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; player.grounded = true; player.land = 1; }
  }
  player.land = damp(player.land, 0, 9, dt);

  // ---- animation
  owl.root.position.set(player.pos.x, player.y, player.pos.z);
  owl.root.rotation.y = player.yaw;
  if (player.grounded) player.phase += player.speed * dt * 8;
  owl.animate(dt, t, { speed: player.speed, phase: player.phase, air: !player.grounded, vy: player.vy, land: player.land });
  owl.blob.position.set(player.pos.x, 0.012, player.pos.z);
  owl.blob.scale.setScalar(1 - clamp(player.y, 0, 1) * 0.4);
  grassU.uPlayer.value.set(player.pos.x, 0, player.pos.z);

  // ---- camera
  cam.yaw = damp(cam.yaw, cam.tYaw, 10, dt); cam.pitch = damp(cam.pitch, cam.tPitch, 10, dt); cam.dist = damp(cam.dist, cam.tDist, 8, dt);
  cam.target.lerp(new THREE.Vector3(player.pos.x, 0.58 + player.y * 0.5, player.pos.z), 1 - Math.exp(-8 * dt));
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.target.x + Math.sin(cam.yaw) * cp * cam.dist, cam.target.y + Math.sin(cam.pitch) * cam.dist, cam.target.z + Math.cos(cam.yaw) * cp * cam.dist);
  camera.position.y = Math.max(camera.position.y, groundH(camera.position.x, camera.position.z) + 0.25);
  camera.lookAt(cam.target);

  // ---- world bits that follow the camera / player
  sky.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(MOON_DIR, 300); moon.lookAt(camera.position);
  moonGlow.position.copy(moon.position);
  moonLight.position.copy(player.pos).add(LIGHT_OFF); moonLight.target.position.copy(player.pos);
  for (const l of lanterns) {
    const f = 0.82 + 0.1 * Math.sin(t * 9 + l.ph) + 0.08 * Math.sin(t * 23.7 + l.ph * 2);
    l.light.intensity = l.base * f; l.flame.scale.setScalar(0.9 + f * 0.15);
  }
  candles.forEach((c, i) => { c.scale.set(1, 1.6 + 0.3 * Math.sin(t * 13 + i * 7), 1); });
}

const clock = new THREE.Clock();
let first = true;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  clockU.value += dt;
  update(dt, clockU.value);
  renderer.render(scene, camera);
  if (first) { first = false; requestAnimationFrame(() => document.getElementById('loader').classList.add('done')); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
window.__owl = { player, owl, cam, keys };  // handy for poking at things from the console
frame();
</script>
</body>
</html>
